[workspace]
members = [
    "crates/tunic-app",
    "crates/tunic-cli",
    "crates/tunic-dsp",
    "crates/tunic-engine",
    "crates/tunic-macos",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
tunic-dsp = { path = "crates/tunic-dsp" }
tunic-engine = { path = "crates/tunic-engine" }
tunic-macos = { path = "crates/tunic-macos" }
