[workspace]
members = [
    "crates/tunic-app",
    "crates/tunic-core",
    "crates/tunic-macos",
    "crates/tunic-presets",
    "crates/tunic-ui",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
block2 = "0.6.2"
gpui = { package = "gpui-ce", version = "=0.2.2" }
gpui-platform = { package = "gpui_ce_platform", version = "=0.1.0", features = ["font-kit"] }
nutype = "0.8.0"
objc2 = "0.6.4"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSDictionary",
    "NSString",
    "NSUUID",
] }
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tunic-macos = { path = "crates/tunic-macos" }
tunic-core = { path = "crates/tunic-core" }
tunic-presets = { path = "crates/tunic-presets" }
tunic-ui = { path = "crates/tunic-ui" }
