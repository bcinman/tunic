[workspace]
members = [
    "crates/tunic-core",
    "crates/tunic-ffi",
    "crates/tunic-presets",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
boltffi = "=0.30.1"
nutype = "0.8.0"
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tunic-core = { path = "crates/tunic-core" }
tunic-presets = { path = "crates/tunic-presets" }
