[workspace]
members = [
    "crates/tunic-core",
    "crates/tunic-desktop",
    "crates/tunic-ffi",
    "crates/tunic-presets",
    "crates/tunic-ui",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
boltffi = "=0.30.1"
gpui = { package = "gpui-ce", version = "=0.2.2" }
gpui-platform = { package = "gpui_ce_platform", version = "=0.1.0", features = ["font-kit"] }
nutype = "0.8.0"
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tunic-core = { path = "crates/tunic-core" }
tunic-presets = { path = "crates/tunic-presets" }
tunic-ui = { path = "crates/tunic-ui" }
