[workspace]
members = [
    "crates/tunic-app",
    "crates/tunic-cli",
    "crates/tunic-dsp",
    "crates/tunic-engine",
    "crates/tunic-macos",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
block2 = "0.6.2"
clap = { version = "4.6", features = ["derive"] }
criterion = "0.8.2"
ctrlc = "3.5"
gpui = { package = "gpui-unofficial", version = "1.22.0-pre" }
gpui-platform = { package = "gpui-platform-gpui-unofficial", version = "1.22.0-pre", features = ["font-kit"] }
objc2 = "0.6.4"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSDictionary",
    "NSValue",
    "NSString",
    "NSUUID",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2.0"
tunic-dsp = { path = "crates/tunic-dsp" }
tunic-engine = { path = "crates/tunic-engine" }
tunic-macos = { path = "crates/tunic-macos" }
