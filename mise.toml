[tools]
rust = "nightly-2026-09-20"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Lint all Rust targets"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Test the Rust workspace"
run = "cargo test --workspace --all-targets --all-features"

[tasks.check]
description = "Run all repository checks"
depends = ["fmt", "lint", "test", "check-native"]

[tasks.check-native]
description = "Build the native Swift menu-bar app"
run = "swift build --package-path apps/tunic-native"

[tasks.build-app]
description = "Build the GPUI application"
run = "cargo build -p tunic-app"

[tasks.run-app]
description = "Build and launch the GPUI application"
run = "cargo run -p tunic-app"

[tasks.run-native]
description = "Build and launch the native Swift menu-bar app"
run = "swift run --package-path apps/tunic-native Tunic"
