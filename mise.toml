[tools]
rust = { version = "nightly-2026-09-20", components = ["clippy", "rustfmt"] }
python = "3.14.7"
"cargo:boltffi_cli" = "0.30.1"
swiftlint = "0.65.1"

[env]
# Match the Swift package minimum when compiling bundled SQLite's C source.
MACOSX_DEPLOYMENT_TARGET = "26.0"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Lint all Rust targets"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.lint-native]
description = "Lint native Swift sources, tests, and package manifest"
run = "swiftlint lint --strict"

[tasks.test]
description = "Test the Rust workspace"
run = "cargo test --workspace --all-targets --all-features"

[tasks.check]
description = "Run all repository checks"
depends = ["fmt", "lint", "test", "test-preset-import", "test-audio-null", "check-native"]

[tasks.check-audio-fidelity]
description = "Compare processor output with independent EQ references and exact bypass"
run = "cargo test -p tunic-core --test audio_fidelity -- --nocapture"

[tasks.audit-audio-rate]
description = "Check live macOS aggregate sample rates using an unmuted private tap"
run = "cargo test -p tunic-macos live_callback_sample_rates_match_output -- --ignored --nocapture"

[tasks.test-audio-null]
description = "Verify loopback analysis detects gain changes, channel swaps, and dropped frames"
run = "python -B -m unittest discover -s crates/tunic-macos -p 'test_*.py'"

[tasks.audio-null]
description = "Generate a stereo probe or compare two PCM WAV recordings"
run = "python -B crates/tunic-macos/audio_null.py"

[tasks.test-preset-import]
description = "Test offline preset extraction without network access"
run = "python -B -m unittest discover -s crates/tunic-presets -p 'test_*.py'"

[tasks.import-oratory]
description = "Import a saved Reddit wiki JSON using a PDF cache (macOS)"
run = "python -B crates/tunic-presets/import_oratory.py"

[tasks.check-native]
description = "Build and test the native Swift menu-bar app"
depends = ["build-ffi", "lint-native"]
run = "swift test --package-path apps/tunic-native"

[tasks.build-ffi]
description = "Generate and package the macOS Rust bindings"
run = "boltffi pack apple"

[tasks.build-app]
description = "Build the GPUI application"
run = "cargo build -p tunic-app"

[tasks.run-app]
description = "Build and launch the GPUI application"
run = "cargo run -p tunic-app"

[tasks.run-native]
description = "Build and launch the native Swift menu-bar app"
depends = ["build-ffi"]
run = "swift run --package-path apps/tunic-native Tunic"

[tasks.build-native-bundle]
description = "Build a locally signed Tunic.app with Automation permission metadata"
depends = ["build-ffi"]
run = "bash apps/tunic-native/build-bundle.sh"

[tasks.run-native-bundle]
description = "Build and open the native app bundle (supports Now Playing authorization)"
depends = ["build-native-bundle"]
run = "open target/native/Tunic.app"

[tasks.release]
description = "Prepare a signed local release and optionally upload a GitHub draft: VERSION [--upload]"
run = "bash script/release.sh"

[tasks.run-native-release]
description = "Build and launch the native Swift menu-bar app with Rust and Swift in release mode"
run = [
    "boltffi pack apple --release",
    "swift run -c release --package-path apps/tunic-native Tunic",
]
